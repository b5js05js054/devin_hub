<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 1024 1024">
  <!-- BaiLan mark for small sizes: the peak and mist of apps/desktop/resources/icon.svg, enlarged and without its fine detail. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
