      <stop offset=".3" stop-color="#3848E8"/>
      <stop offset=".5" stop-color="#6F80FF"/>
      <stop offset=".62" stop-color="#B49CF4"/>
      <stop offset=".73" stop-color="#F2B2CC"/>
      <stop offset="1" stop-color="#FFD8CC"/>
    </linearGradient>
